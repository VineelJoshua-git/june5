<!DOCTYPE html>
<html>
<head>
<title>Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

<h2 class="mb-4">Course Registration</h2>

<form>

<input class="form-control mb-3" placeholder="Student Name">

<input type="email" class="form-control mb-3" placeholder="Email">

<input class="form-control mb-3" placeholder="Mobile Number">

<select class="form-select mb-3">
<option>Male</option>
<option>Female</option>
</select>

<select class="form-select mb-3">
<option>Web Development</option>
<option>Python</option>
<option>Data Science</option>
</select>

<input class="form-control mb-3" placeholder="Qualification">

<textarea class="form-control mb-3" rows="3" placeholder="Address"></textarea>

<input type="file" class="form-control mb-3">

<div class="form-check mb-3">
<input type="checkbox" class="form-check-input">
<label>I agree to terms and conditions</label>
</div>

<button class="btn btn-success" data-bs-toggle="modal" data-bs-target="#success">
Submit
</button>

</form>

<div class="modal fade" id="success">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5>Success</h5>
</div>
<div class="modal-body">
Registration Submitted Successfully.
</div>
</div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>a
