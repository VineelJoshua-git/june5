<!DOCTYPE html>
<html>
<head>
<title>Registration</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container py-5">

<h2>Event Registration</h2>

<form>

<input type="text" class="form-control mb-3" placeholder="Student Name">

<input type="text" class="form-control mb-3" placeholder="Roll Number">

<input type="text" class="form-control mb-3" placeholder="Branch">

<input type="email" class="form-control mb-3" placeholder="Email">

<input type="text" class="form-control mb-3" placeholder="Mobile Number">

<select class="form-select mb-3">
<option>Select Event</option>
<option>Technical Quiz</option>
<option>Hackathon</option>
<option>Coding Contest</option>
</select>

<button class="btn btn-success" type="button"
data-bs-toggle="modal"
data-bs-target="#success">
Register
</button>

</form>

<div class="modal fade" id="success">
<div class="modal-dialog">
<div class="modal-content">
<div class="modal-header">
<h5>Success</h5>
</div>
<div class="modal-body">
Registration Successful
</div>
</div>
</div>
</div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

</body>
</html>s
